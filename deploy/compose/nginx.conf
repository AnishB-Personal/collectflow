# ==============================================================================
# CollectFlow Same-Origin Reverse Proxy Configuration (Nginx)
#
# SECURITY & DEPLOYMENT NOTICE:
# 1. This Nginx configuration is HTTP-only and intended SOLELY for isolated local
#    integration and development testing.
# 2. PROHIBITED AS-IS FOR PUBLIC / AWS DEPLOYMENTS:
#    Directly exposing this HTTP proxy configuration to the public internet or
#    deploying it as-is on AWS / cloud infrastructure without TLS is strictly
#    prohibited. Any production deployment MUST terminate TLS externally via a
#    managed load balancer (e.g., AWS ALB, Cloudflare, Ingress) or include a
#    dedicated TLS termination block with valid certificates.
# 3. Same-origin routing:
#    - /       -> frontend:3000 (TanStack Start SSR)
#    - /api/   -> backend:8000  (FastAPI Backend)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 16M;

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Nginx liveness probe
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Backend API routing
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Frontend SSR routing
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
