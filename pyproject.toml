[project]
name = "collectflow"
version = "1.0.0"
description = "Order-to-Cash & Collections Management System"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501", # line length
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
norecursedirs = ["tests/legacy", ".venv", "venv"]
addopts = "--ignore=tests/legacy"
